name: daily

on:
  schedule:
    # 时段一：北京时间 23:30（UTC 15:30），周一到周五。
    # 当日数据此时均已发布：中金所 16:30~17:00、沪市 23:00、深市 23:20（初值）。
    # 采完即发布，当晚就能在页面上看到当天数据。
    - cron: "30 15 * * 1-5"
    # 时段二：北京时间 08:45（UTC 00:45），周二到周六，对应前一交易日 T 的终值。
    # 这一场是**终值覆盖**，与晚间那场的采集范围不同：
    #   · 沪市份额从「库内最新日」原样重抓（不是从次日推进，否则库内已到 T 时一行不采）；
    #   · 深市走 5 日窗口，天然覆盖；
    #   · K 线末日已到也重拉一次，校正成交额/成交量（VWAP、净申赎金额依赖它）。
    # 依据是深市官方口径「T 日晚间仅供参考，以 T+1 日早间规模为准」。
    - cron: "45 0 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 还原数据库快照
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p 数据库
          if gh release download data --pattern "etf.db.gz" --dir /tmp --clobber 2>/dev/null; then
            gunzip -c /tmp/etf.db.gz > 数据库/etf.db
            echo "已还原 $(du -h 数据库/etf.db | cut -f1)"
          else
            echo "::warning::没有数据库快照，走全量建库（约 40 分钟，仅首次）"
            python scripts/build_db.py
          fi

      - name: 增量采集 + 重建两站
        id: collect
        run: |
          set +e
          python scripts/collect.py
          rc=$?
          set -e
          # 0 = 全部成功；2 = 部分降级（某站依赖未就绪，其余站已更新），两者都可发布；
          # 1 = 致命失败（份额没采到 / 重建报错），页面不可信，终止不部署。
          if [ $rc -eq 2 ]; then
            echo "::warning::部分降级：有站点保留上一版，详见上方日志"
            exit 0
          fi
          exit $rc

      - name: 页面自检（库→网页逐格）
        run: python scripts/check_page.py

      - name: 组装站点
        run: |
          mkdir -p site
          cp 网页/index.html site/index.html
          cp -r 网页/国家队站 site/
          cp -r 网页/行业站 site/
          du -sh site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 回写数据库快照
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gzip -6 -c 数据库/etf.db > /tmp/etf.db.gz
          ls -lh /tmp/etf.db.gz
          if gh release view data >/dev/null 2>&1; then
            gh release upload data /tmp/etf.db.gz --clobber
          else
            gh release create data /tmp/etf.db.gz \
              -t "etf.db 快照" -n "每日增量后的数据库快照，每次运行覆盖"
          fi

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
