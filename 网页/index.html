<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ETF 份额动向追踪</title>
<style>
:root{--bg:#ffffff;--card:#f6f8fa;--border:#d0d7de;--muted:#57606a;--text:#1f2328;--up:#cf222e;--down:#1a7f37;--accent:#0969da;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6}
.wrap{max-width:820px;margin:0 auto;padding:56px 20px 40px}
h1{font-size:24px;margin:0 0 6px;font-weight:600}
.sub{color:var(--muted);font-size:13px;margin-bottom:28px}
a.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px 22px;margin-bottom:14px;transition:border-color .15s,transform .15s}
a.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card h2{font-size:16px;margin:0 0 6px;font-weight:600;color:var(--accent)}
.card p{margin:0;font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid var(--border);color:var(--muted);margin-left:8px;vertical-align:2px}
.foot{margin-top:30px;font-size:12px;color:var(--muted);border-top:1px solid var(--border);padding-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>ETF 份额动向追踪</h1>
  <div class="sub">数据来源：上交所 / 深交所 / 中金所 公开披露 · 单位统一为亿份（份额，非金额）</div>

  <a class="card" href="./国家队站/">
    <h2>国家队宽基 ETF 动向追踪<span class="tag">18 只 · 2024-01 起</span></h2>
    <p>汇金系宽基净申赎、份额分位、中信期货席位净空单、2025 年报持仓基准</p>
  </a>

  <a class="card" href="./行业站/">
    <h2>细分行业 ETF 动向追踪<span class="tag">12 大类 / 92 子类 · 2016-12 起</span></h2>
    <p>1694 只沪深 ETF 的份额变化全景、近一周变化率与历史分位</p>
  </a>

  <div class="foot">
    每个交易日 08:45 与 10:45（北京时间）自动更新。若当日数据未发布或采集不完整，页面保留上一版而不展示半截数据。
  </div>
</div>
</body>
</html>
